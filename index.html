<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirect</title>
</head>
<body>
<script>
const ua = navigator.userAgent.toLowerCase();

if (/iphone|ipod|ipad/.test(ua)) {
    // iOS
    window.location.replace("https://apps.apple.com/app/id6502765671");
}
else if (ua.includes("android")) {
    // Android
    window.location.replace("https://play.google.com/store/apps/details?id=com.kamakurablog.suzuran.suzuran2024catroom.dist");
}
else {
    // PCなど
    window.location.replace("https://apps.apple.com/app/id6502765671");
}
</script>
</body>
</html>
